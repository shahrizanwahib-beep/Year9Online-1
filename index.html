function openSession(id){session=BANK.sessions.find(s=>s.id===id);attempt=record.sessions[id]||(record.sessions[id]={answers:Array.from({length:25},()=>[]),index:0,started:Date.now()});current=attempt.index||0;repair=false;localError='';save();if(attempt.result)results();else model();}
function model(){root.replaceChildren();$('identity').textContent=profile.name+' · '+profile.className;$('progress').hidden=true;const grid=el('div',undefined,'model-grid');grid.append(photo(session.image,session.title));const body=el('section');body.append(el('p',session.title.toUpperCase(),'eyebrow'),el('h1','KENAL → BACA\n→ BINA AYAT'),el('p','Objektif: Memahami dua teks pendek, membina ayat mudah dan mengenal kata nama.','objective'));
 const words=session.vocab;
 const vocab=el('dl',undefined,'vocab-labels');for(const [ms,en]of words){const d=el('div');d.append(el('dt',ms),el('dd',en));vocab.append(d);}body.append(vocab);
 const flow=el('div',undefined,'growth');const lines=session.model;lines.forEach((t,i)=>{const row=el('div');row.append(el('b',String(i+1)),el('p',t));flow.append(row);});body.append(flow,el('p','Mula dengan siapa dan perbuatan. Kemudian tambah tempat dan masa.','muted'),el('p','Start with who and the action. Then add place and time.','translation'),button(attempt.answers.some(a=>a.length)?'Sambung latihan':'Mula latihan',()=>{render();window.scrollTo(0,0);},'primary'));grid.append(body);root.append(grid);}
function answerFor(q){return repair?attempt.practice[q.id-1]:attempt.answers[q.id-1];}
function complete(q,a){return Array.isArray(a)&&a.length===(q.type==='choice'?1:q.tokens.length);}
function count(){return session.questions.filter(q=>complete(q,attempt.answers[q.id-1])).length;}
function sentence(q,a){let s=a.map(i=>q.tokens[i]).join(' ');if(!s)return '';s=s[0].toUpperCase()+s.slice(1);if(a.length===q.tokens.length){s=s.replace(/^(Pada hari [^ ]+) /i,'$1, ').replace(/, Kami\b/g,', kami');s+='.';}return s;}
function write(q,a){if(busy||attempt.pending||attempt.result&&!repair)return;if(repair)attempt.practice[q.id-1]=a;else attempt.answers[q.id-1]=a;localError='';save();renderQuestion();updateProgress();}
function updateProgress(){const n=count();$('progress').hidden=false;$('bar').value=n;$('count').textContent=n+' / 25 dijawab';$('identity').textContent=profile.name+' · '+profile.className;}
function go(i){current=Math.max(0,Math.min(24,i));attempt.index=current;localError='';save();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){root.replaceChildren();updateProgress();
 const trail=el('nav',undefined,'sections');for(const [name,index,total]of [['Kosa kata',0,5],['Membaca',5,8],['Bina ayat',13,8],['Kata nama',21,4]]){const b=button(name+' · '+total,()=>go(index));b.classList.toggle('active',current>=index&&current<index+total);trail.append(b);}trail.append(iconButton('Lihat contoh','lightbulb',model));root.append(trail);
 const stage=el('div');stage.id='questionArea';root.append(stage);renderQuestion();
 const foot=el('div',undefined,'navigation');const prev=iconButton('Soalan sebelumnya','arrow-left',()=>go(current-1));prev.disabled=current===0;const next=button(current===24?'Semak semua jawapan':'Seterusnya',()=>current===24?overview():go(current+1),'primary');foot.append(prev,el('span','SOALAN '+(current+1)+' / 25'),next);root.append(foot);
 const finish=button(repair?'Semak pembetulan':attempt.pending?'Cuba hantar semula':'Semak dan hantar',overview,'finish');finish.disabled=busy;root.append(finish);
}
function renderQuestion(){const target=$('questionArea');if(!target)return;target.replaceChildren();const q=session.questions[current],a=answerFor(q),locked=busy||!!attempt.pending||!!attempt.result&&!repair;
 const grid=el('div',undefined,'question-grid '+(q.text!==undefined?'reading-grid':''));
 const visual=el('section',undefined,'visual');
 if(q.text!==undefined){const t=session.texts[q.text];visual.classList.add('passage');visual.append(el('p','TEKS '+(q.text+1),'eyebrow'),el('h2',t.title),el('p',t.text,'reading'),el('p',t.help,'translation'));}
 else if(q.image){visual.append(photo(q.image,q.label||q.prompt));const caption=el('div',q.label||session.title,'image-label');visual.append(caption);}
 else if(q.type==='order'){visual.classList.add('noun-display');visual.append(el('p','AYAT BERTUMBUH / GROW YOUR SENTENCE','eyebrow'),el('h2','SIAPA?\nBUAT APA?\nDI MANA?\nBILA?'),el('p','Who? · Action? · Where? · When?','translation'));}
 else{visual.classList.add('noun-display');visual.append(el('p','KATA NAMA / NOUN','eyebrow'),el('h2','ORANG\nHAIWAN\nTEMPAT\nBENDA'),el('p','People · Animals · Places · Things','translation'));}
 const body=el('section',undefined,'question-body');body.append(el('p',(repair?'PEMBETULAN / ':'')+String(q.id).padStart(2,'0')+' / '+q.group.toUpperCase(),'eyebrow'),el('p','Objektif: '+({'Kosa kata':'Mengenal kosa kata dalam konteks.','Membaca':'Mencari maklumat yang dinyatakan dalam teks.','Ayat':'Menyusun frasa menjadi ayat yang gramatis.','Kata nama':'Mengenal dan mengelaskan kata nama.'}[q.group]),'objective'),el('h1',q.prompt));
 if(q.hint)body.append(el('p',q.hint,'translation'));
 if(q.type==='choice'){
  body.append(el('p',q.text!==undefined?'Read the text and choose the answer.':'Choose the correct answer.','translation'));
  const options=el('div',undefined,'options');options.setAttribute('role','group');options.setAttribute('aria-label','Pilihan jawapan');q.options.forEach((t,i)=>{const b=button(t,()=>write(q,[i]),'option'+(a[0]===i?' selected':''));b.setAttribute('aria-pressed',String(a[0]===i));b.disabled=locked;const letter=el('b',String.fromCharCode(65+i));b.prepend(letter);options.append(b);});body.append(options);
 }else{
  if(q.seed){const seed=el('div',undefined,'seed');seed.append(el('small','AYAT ASAS / BASE SENTENCE'),el('p',q.seed));body.append(seed);}
  const line=el('div',undefined,'sentence-track');line.setAttribute('aria-label','Susunan ayat');if(!a.length)line.append(el('p','Siapa? → Buat apa? → Maklumat tambahan','placeholder'));a.forEach((id,i)=>{const b=button(q.tokens[id],()=>write(q,a.filter((_,j)=>j!==i)),'phrase');b.disabled=locked;b.title='Keluarkan frasa';line.append(b);});body.append(line);
  body.append(el('p',sentence(q,a)||'…','sentence-preview'));
  const pool=el('div',undefined,'phrase-pool');q.tokens.forEach((t,i)=>{const b=button(t,()=>write(q,[...a,i]),'phrase');b.disabled=locked||a.includes(i);b.dataset.token=i;pool.append(b);});body.append(pool);
  const tools=el('div',undefined,'sentence-tools');const undo=iconButton('Undur frasa terakhir','rotate-left',()=>write(q,a.slice(0,-1)));undo.disabled=locked||!a.length;const clear=iconButton('Kosongkan ayat','eraser',()=>write(q,[]));clear.disabled=locked||!a.length;tools.append(undo,clear,el('p','Pilih frasa mengikut urutan. / Choose the phrases in order.','translation'));body.append(tools);
 }
 if(repair){const d=attempt.result.details.find(d=>d.id===q.id);body.append(el('p','Jawapan contoh: '+d.correct,'correction'),el('p',d.explanation,'translation'));}
 if(localError)body.append(el('p',localError,'error'));
 grid.append(visual,body);target.append(grid);
 if(q.story){const story=el('div',undefined,'story-strip');session.questions.filter(x=>x.story).forEach(x=>{const tile=el('article');if(x.image)tile.append(photo(x.image,x.label));tile.append(el('b','BABAK '+x.story),el('p',sentence(x,answerFor(x))||'Bina ayat untuk babak ini.'));story.append(tile);});target.append(story);}
}
function overview(){root.replaceChildren();updateProgress();root.append(el('p',session.title.toUpperCase(),'eyebrow'),el('h1',repair?'PEMBETULAN SELESAI':'SEMAK SEBELUM HANTAR'),el('p',repair?'Latihan pembetulan tidak mengubah markah pertama.':'Jawapan akhir akan dikunci apabila penghantaran bermula.','muted'));
 const grid=el('div',undefined,'number-grid');for(const q of session.questions){const b=button(String(q.id),()=>go(q.id-1),'number '+(complete(q,answerFor(q))?'done':''));b.title=q.group+' · '+q.prompt;grid.append(b);}root.append(grid);
 const notice=el('p',repair?'Pembetulan disimpan pada peranti sahaja.':count()+' daripada 25 soalan lengkap.','notice');root.append(notice);
 if(!repair&&!window.LESSON_CONFIG.gasUrl)root.append(el('p','Pratonton tempatan: GAS belum disambungkan. Jawapan boleh dicuba tetapi tiada markah dihantar atau dinilai.','notice'));
 if(localError)root.append(el('p',localError,'error'));
 const send=button(repair?'Lihat markah asal':busy?'Menghantar…':attempt.pending?'Cuba hantar semula':'Hantar jawapan',repair?results:submit,'primary');send.id='send';send.disabled=busy||!repair&&count()!==25;root.append(send,button('Kembali ke latihan',()=>go(current),'secondary'));
}
function rpc(payload){return new Promise((resolve,reject)=>{
 const url=window.LESSON_CONFIG.gasUrl;if(!/^https:\/\/script.google.com\/macros\/s\/[a-z0-9_-]+\/exec$/i.test(url||''))return reject(Error('URL GAS /exec belum ditetapkan.'));
 if(location.protocol!=='https:')return reject(Error('Penghantaran memerlukan laman HTTPS seperti GitHub Pages.'));
 const nonce=uid(),frame=el('iframe'),form=el('form'),input=el('input');frame.name='gas_'+nonce;frame.hidden=form.hidden=true;form.method='POST';form.action=url;form.target=frame.name;input.type='hidden';input.name='request';input.value=JSON.stringify({action:'submit',origin:location.origin,nonce,payload});form.append(input);
 let done=false;const timer=setTimeout(()=>finish(Error('Pengesahan belum diterima. Jawapan dikekalkan; cuba hantar semula.')),45000);
 function finish(error,result){if(done)return;done=true;clearTimeout(timer);removeEventListener('message',receive);form.remove();frame.remove();error?reject(error):resolve(result);}
 function receive(e){if(!/^https:\/\/(?:script\.google\.com|(?:[a-z0-9-]+-)?script\.googleusercontent\.com)$/.test(e.origin))return;const d=e.data;if(!d||d.channel!=='y9-dua-sesi-v1'||d.nonce!==nonce)return;finish(d.ok?null:Error(d.error||'Penghantaran gagal.'),d.result);}
 addEventListener('message',receive);document.body.append(frame,form);form.submit();
 });}
async function submit(){if(busy||count()!==25)return;if(!window.LESSON_CONFIG.gasUrl){localError='Pratonton sahaja. Sambungkan GAS untuk penilaian dan simpanan Sheets.';overview();return;}
 attempt.pending=attempt.pending||{version:BANK.version,sessionId:session.id,deviceToken:record.token,...profile,answers:attempt.answers.map(a=>a.slice())};busy=true;localError='';save();overview();
 try{const result=await rpc(attempt.pending);if(!result?.saved||result.sessionId!==session.id||result.max!==25||result.details?.length!==25)throw Error('Pengesahan GAS tidak lengkap. Cuba semula.');attempt.result=result;attempt.pending=null;repair=false;save();results();}
 catch(e){localError=e.message;overview();}finally{busy=false;if($('send'))overview();}
}
function results(){repair=false;const r=attempt.result;root.replaceChildren();updateProgress();root.append(el('p',session.title.toUpperCase(),'eyebrow'),el('h1','MISI SELESAI.'),el('p','Berjaya disimpan · Disahkan oleh GAS · '+r.id.slice(0,12),'receipt'));const score=el('div',undefined,'score');score.append(el('b',String(r.score)),el('span','/ 25'));root.append(score);
 const parts=el('div',undefined,'breakdown');for(const [name,max]of [['Kosa kata',5],['Membaca',8],['Ayat',8],['Kata nama',4]]){const d=el('div');d.append(el('p',name),el('b',r.groups[name]+' / '+max));parts.append(d);}root.append(parts);
 if(r.warning)root.append(el('p',r.warning,'notice'));
 root.append(button('Baiki jawapan',()=>{attempt.practice=attempt.answers.map(a=>a.slice());repair=true;current=Math.max(0,r.details.findIndex(d=>!d.ok));render();},'primary'),button('Kembali ke permulaan',home,'secondary'));
 const review=el('details');review.append(el('summary','Lihat jawapan dan penerangan'));for(const d of r.details){const q=session.questions[d.id-1],item=el('article',undefined,'review-item');item.append(el('b',d.id+'. '+q.prompt),el('p','Jawapan anda: '+d.selected,d.ok?'correct':'wrong'),el('p','Jawapan contoh: '+d.correct),el('p',d.explanation,'translation'));review.append(item);}root.append(review);
 const stories=session.questions.filter(q=>q.story);const story=el('div',undefined,'story-output');story.append(el('h2','Cerita tiga babak anda'));for(const q of stories)story.append(el('p',sentence(q,attempt.answers[q.id-1])));root.append(story);
}
$('home').onclick=()=>{if(!busy)home();};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key.toLowerCase()==='f')$('full').click();if(session&&$('questionArea')){if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);}});
document.fonts.load('900 16px "Font Awesome 6 Free"').then(fonts=>{if(fonts.length)document.documentElement.classList.add('icons-ready');}).catch(()=>{});
home();
</script></body></html>
